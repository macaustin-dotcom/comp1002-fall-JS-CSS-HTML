       <!-- Add our CSS -->

       <body>
              <header>
                      
                     <nav>
                            <menu>
                                   <li><a href="index.html">Link one</a></li>
                                   <li><a href="index.html">Link two</a></li>
                                   <li><a href="index.html">Link three</a></li>
                            </menu>
                     </nav>
              </header>  
              <!-- the main text of this page -->
               <main>
                     <!-- This first section of content is called a hero/masthead -->
                      <section>
                            <div>
                                   <h1>This is an Introduction Title</h1>
                            </div>
                      </section>
                      <section>
                            <!-- column one -->
                            <div>
                                   <figure>
                                         <img src="./img/toronto.jpg"  alt="Toronto skyline">
                                         <figcaption>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste, impedit!</figcaption>
                                   </figure>
                            </div>
                            <!-- column two -->
                            <div>
                                   <h2>I am title</h2>
                                   <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Non, esse.</p>
                            </div>
                      </section>
                      <!-- our next row of content will hold our videos -->
                       <section>
                            <div>
                            <h3>iframe Video</h3>
                            <iframe width="560" height="315" src="https://www.youtube.com/embed/_OBlgSz8sSM?si=svDt4K7CxU6CNxgi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                       </div>
                       <div>
                            <h3>HTML Video Player Example</h3>
                            <video controls loop autoplay muted poster="./img/toronto.jpg">
                            <source src="./video/toronto.mp4" type="video/mp4">
                            Your browser sucks upgrade the damn thing
                            </video>
                       </div>
                       </section>
               </main>
               <footer>
