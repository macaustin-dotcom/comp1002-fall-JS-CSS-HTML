<!DOCTYPE html>
<html lang="en">
<head>
<!-- all the meta data will be called in with a template -->
 <link rel="stylesheet" href="./css/style.css">
 <!-- defer = wait until the whole page is rendered before running the script-->
  <!-- Order Matters: the components must be called before the main.js -->
<script src="./js/components.js" defer></script>
<script src="./js/main.js" defer></script> 
</head>

<!-- data-page tells our JavaScript which page this is -->
<body data-page="home">

  <!-- Empty placeholders. JavaScript fills them in. -->
  <header id="site-header"></header>

  <main>
    <section class="hero">
      <h1>Coffee worth slowing down for</h1>
      <p>Small-batch roasts, fresh baking, and a warm seat by the window.</p>
    </section>

    <h2 class="section-title">Our favourites</h2>
    <section id="cards" class="card-grid" aria-label="Our favourites"></section>

    <section id="cta" class="cta"></section>
  </main>

  <footer id="site-footer"></footer>

</body>
</html>
